name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Two releases racing would both compute the same next version and one would
  # fail to push its tag. Serialize them instead.
  group: release
  cancel-in-progress: false

jobs:
  # Runs on every PR: reports the version this PR would produce once merged,
  # without tagging anything. Also the only way to exercise the release config
  # before it reaches main — workflow_dispatch is unavailable off the default
  # branch.
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Compute next version
        id: next
        run: |
          # semantic-release only acts on a branch in a release group, so stand
          # the merge result up as 'main' locally. Nothing is pushed.
          git checkout -B main
          OUT=$(uvx --from 'python-semantic-release==10.6.2' \
                  semantic-release --noop version --print 2>&1 | tail -1 || true)
          echo "result=$OUT" >> "$GITHUB_OUTPUT"
          echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
          # Also to stdout: step summaries are not visible in `gh run view --log`.
          echo "LATEST TAG:    $(git describe --tags --abbrev=0 2>/dev/null || echo none)"
          echo "NEXT VERSION:  $OUT"
          {
            echo "### Release preview"
            echo ""
            echo "Latest tag: \`$(git describe --tags --abbrev=0 2>/dev/null || echo 'none')\`"
            echo ""
            echo "On merge to main this produces: \`$OUT\`"
            echo ""
            echo "Commits considered:"
            echo '```'
            git log --oneline "$(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~5)"..HEAD 2>/dev/null | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Warn if no baseline tag
        if: steps.next.outputs.tag == 'none'
        run: |
          echo "::warning::No tag exists, so semantic-release treats this as a"\
               "first release and computes 0.1.0 — which would DOWNGRADE the"\
               "version in pyproject.toml. Create a baseline tag before merging."

  release:
    # Push-only, and never on the release commit itself: it carries [skip ci],
    # but a repo setting can disable skip-ci parsing and a re-run of this job on
    # its own commit would loop.
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs the whole history to find the previous tag
          # and every commit since it.
          fetch-depth: 0
          ref: main

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report
        run: |
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "Released ${{ steps.release.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "uvx --from 'git+https://github.com/${{ github.repository }}@${{ steps.release.outputs.tag }}' bb-mcp" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: no feat/fix/perf commits since the last tag." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The versioned image must be built AFTER the tag exists, from the tagged
  # commit. Chaining it here rather than relying on docker.yml's `tags: v*`
  # trigger is deliberate: GitHub does not start workflows from events created
  # with GITHUB_TOKEN, so the tag semantic-release pushes never fires that
  # trigger. (A hand-pushed tag does — which is why v0.5.0 got an image and
  # v0.5.1 did not.)
  docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag, not main: main has moved on by the release commit, and the
          # image must match what the tag points at.
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # `value:` supplies the version explicitly — the triggering event is a
          # push to main, so metadata-action cannot infer it from the ref.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
