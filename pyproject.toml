[project]
name = "bb-mcp"
version = "0.5.0"
description = "MCP server for BlueBubbles iMessage bridge"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0,<4",
    "httpx>=0.27.0",
    "typer>=0.12",
]

[project.scripts]
bb-mcp = "bb_mcp.server:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.semantic_release]
# pyproject.toml is the single source of truth; bb_mcp.__version__ reads it back
# out of the installed metadata, so this one line keeps the tag, the package,
# and the version reported over MCP in lockstep.
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version} [skip ci]"
# [skip ci] above stops the release commit from re-triggering CI and Docker on
# main; the tag push is what drives the versioned image build.
# No build_command: the action runs in its own container where the runner's uv
# is not on PATH (exit 127), and this project ships via git+uvx and ghcr, not
# PyPI — so there is no distribution for the release job to build.
major_on_zero = true
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = ["build", "chore", "ci", "docs", "refactor", "style", "test"]

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):"]

[tool.hatch.build.targets.wheel]
packages = ["src/bb_mcp"]
